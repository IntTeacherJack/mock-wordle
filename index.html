<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <style>
      :root { --green: #6aaa64; --yellow: #c9b458; --gray: #787c7e; --light: #d3d6da; --key: #d3d6da; font-family: "Helvetica Neue", Arial, Helvetica, sans-serif; color: #1a1a1b; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; min-height: 100vh; }
      button, input { font: inherit; }
      header { height: 55px; border-bottom: 1px solid #d3d6da; display: flex; align-items: center; justify-content: space-between; padding: 0 13px; }
      .header-left, .header-right { display: flex; align-items: center; gap: 19px; }
      .icon-button { width: 25px; height: 32px; border: 0; padding: 0; background: transparent; color: #1a1a1b; cursor: pointer; display: grid; place-items: center; }
      .hamburger, .hamburger::before, .hamburger::after { width: 20px; height: 2px; background: #1a1a1b; display: block; content: ""; }
      .hamburger { position: relative; }
      .hamburger::before { position: absolute; top: -7px; }
      .hamburger::after { position: absolute; top: 7px; }
      .bulb { position: relative; width: 16px; height: 20px; border: 3px solid #1a1a1b; border-radius: 50% 50% 45% 45%; }
      .bulb::after { content: ""; position: absolute; width: 8px; height: 3px; background: #1a1a1b; bottom: -6px; left: 1px; border-radius: 1px; }
      .stats { width: 23px; height: 22px; display: flex; gap: 3px; align-items: flex-end; border-bottom: 2px solid #1a1a1b; }
      .stats i { width: 5px; border: 2px solid #1a1a1b; display: block; } .stats i:nth-child(1) { height: 11px; } .stats i:nth-child(2) { height: 18px; } .stats i:nth-child(3) { height: 14px; }
      .help { font-size: 1.45rem; font-weight: 700; line-height: 1; border: 2px solid #1a1a1b; width: 22px; height: 22px; border-radius: 50%; }
      .settings-mark { font-size: 1.65rem; line-height: 1; }
      main { min-height: calc(100vh - 55px); display: grid; grid-template-rows: minmax(18px, 1fr) auto minmax(8px, .16fr) auto minmax(10px, .35fr); justify-items: center; padding: 0 10px 16px; }
      #toast { grid-row: 1; align-self: end; margin-bottom: 8px; }
      #board { grid-row: 2; width: min(350px, calc(100vw - 32px)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
      .tile { aspect-ratio: 1; border: 2px solid var(--light); display: flex; align-items: center; justify-content: center; font-size: clamp(1.55rem, 7vw, 2rem); font-weight: 700; line-height: 1; text-transform: uppercase; user-select: none; }
      .tile.filled { border-color: #878a8c; animation: pop 90ms linear; }
      .tile.correct { color: #fff; background: var(--green); border-color: var(--green); }
      .tile.present { color: #fff; background: var(--yellow); border-color: var(--yellow); }
      .tile.absent { color: #fff; background: var(--gray); border-color: var(--gray); }
      .tile.revealing { animation: flip .5s ease forwards; }
      #keyboard { grid-row: 4; width: min(610px, 100vw); display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0 8px; }
      .key-row { display: flex; gap: 6px; width: 100%; justify-content: center; }
      .key { height: 58px; min-width: 30px; flex: 1; max-width: 54px; border: 0; border-radius: 4px; color: #1a1a1b; background: var(--key); font-size: .84rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
      .key.wide { flex: 1.5; max-width: 82px; font-size: .68rem; }
      .key.correct { color: #fff; background: var(--green); }
      .key.present { color: #fff; background: var(--yellow); }
      .key.absent { color: #fff; background: var(--gray); }
      #toast { min-height: 1.4em; font-size: .9rem; font-weight: 700; text-align: center; }
      dialog { border: 0; border-radius: 8px; padding: 0; width: min(390px, calc(100vw - 32px)); box-shadow: 0 6px 32px rgba(0, 0, 0, .25); }
      dialog::backdrop { background: rgba(0, 0, 0, .45); }
      .panel { padding: 26px; }
      .panel h2 { margin: 0 0 10px; font-size: 1.35rem; }
      .panel p { margin: 0 0 20px; line-height: 1.45; color: #565758; }
      .panel label { display: block; font-size: .82rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 7px; }
      .panel input { width: 100%; height: 48px; padding: 0 12px; border: 2px solid #878a8c; border-radius: 4px; font-size: 1.1rem; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
      .panel footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
      .panel button { height: 42px; padding: 0 16px; border: 0; border-radius: 4px; font-weight: 700; cursor: pointer; }
      .secondary { background: #e7e7e7; color: #222; }
      .primary { background: var(--green); color: #fff; }
      @keyframes pop { 50% { transform: scale(1.08); } }
      @keyframes flip { 0% { transform: rotateX(0); } 49% { transform: rotateX(90deg); } 51% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
      @media (max-height: 670px) { main { grid-template-rows: minmax(6px, .2fr) auto 8px auto 8px; } .key { height: 48px; } }
    </style>
  </head>
  <body>
    <header>
      <div class="header-left"><button id="settings" class="icon-button" aria-label="Game menu" title="Game menu"><span class="hamburger"></span></button></div>
      <div class="header-right" aria-hidden="true"><span class="bulb"></span><span class="stats"><i></i><i></i><i></i></span><span class="help">?</span><span class="settings-mark">⚙</span></div>
    </header>
    <main>
      <div id="toast" role="status" aria-live="polite"></div>
      <section id="board" tabindex="-1" aria-label="Six rows of five letter guesses"></section>
      <section id="keyboard" aria-label="On-screen keyboard"></section>
    </main>
    <dialog id="teacher-dialog">
      <form id="teacher-form" class="panel">
        <h2>Teacher settings</h2>
        <p>Choose a five-letter vocabulary word before sharing your screen. The answer stays on this local server and is never sent to the game page.</p>
        <label for="answer">New answer</label>
        <input id="answer" name="answer" maxlength="5" pattern="[A-Za-z]{5}" autocomplete="off" required autofocus />
        <footer>
          <button type="button" class="secondary" id="cancel">Cancel</button>
          <button class="primary">Start new game</button>
        </footer>
      </form>
    </dialog>
    <script>
      const board = document.querySelector('#board');
      const keyboard = document.querySelector('#keyboard');
      const toast = document.querySelector('#toast');
      const dialog = document.querySelector('#teacher-dialog');
      const teacherForm = document.querySelector('#teacher-form');
      let game = { guesses: [], status: 'ready' };
      let draft = '';
      let revealing = false;
      const keys = ['QWERTYUIOP', 'ASDFGHJKL', '↵ZXCVBNM⌫'];

      for (let i = 0; i < 30; i += 1) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        board.append(tile);
      }
      keys.forEach((letters, rowIndex) => {
        const row = document.createElement('div');
        row.className = 'key-row';
        [...letters].forEach((letter) => {
          const button = document.createElement('button');
          button.className = `key${letter === '↵' || letter === '⌫' ? ' wide' : ''}`;
          button.textContent = letter === '↵' ? 'ENTER' : letter === '⌫' ? '⌫' : letter;
          button.dataset.key = letter;
          button.addEventListener('click', () => handleKey(letter));
          row.append(button);
        });
        keyboard.append(row);
      });

      function render() {
        [...board.children].forEach((tile) => { tile.className = 'tile'; tile.textContent = ''; });
        game.guesses.forEach(({ word, states }, row) => {
          [...word].forEach((letter, column) => {
            const tile = board.children[row * 5 + column];
            tile.textContent = letter;
            tile.classList.add('filled', states[column]);
          });
        });
        if (game.status === 'playing' || game.status === 'ready') {
          [...draft].forEach((letter, column) => {
            const tile = board.children[game.guesses.length * 5 + column];
            if (tile) { tile.textContent = letter; tile.classList.add('filled'); }
          });
        }
        const rank = { absent: 1, present: 2, correct: 3 };
        const stateByKey = {};
        game.guesses.forEach(({ word, states }) => [...word].forEach((letter, index) => {
          if (!stateByKey[letter] || rank[states[index]] > rank[stateByKey[letter]]) stateByKey[letter] = states[index];
        }));
        document.querySelectorAll('.key').forEach((key) => {
          key.classList.remove('correct', 'present', 'absent');
          if (stateByKey[key.dataset.key]) key.classList.add(stateByKey[key.dataset.key]);
        });
      }

      function show(message) { toast.textContent = message; }
      function handleKey(key) {
        if (game.status !== 'playing' || revealing) return;
        if (key === '⌫') draft = draft.slice(0, -1);
        else if (key === '↵') submitGuess();
        else if (draft.length < 5) draft += key;
        render();
      }
      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

      async function revealGuess(guess, row) {
        const delay = 320;
        [...guess.word].forEach((letter, column) => {
          const tile = board.children[row * 5 + column];
          setTimeout(() => {
            tile.textContent = letter;
            tile.className = 'tile filled revealing';
            setTimeout(() => tile.classList.add(guess.states[column]), 245);
          }, column * delay);
        });
        await wait((guess.word.length - 1) * delay + 520);
      }

      async function submitGuess() {
        if (draft.length !== 5) return show('Not enough letters');
        revealing = true;
        const response = await fetch('/api/guess', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ guess: draft }) });
        const result = await response.json();
        if (!response.ok) { revealing = false; return show(result.error || 'Try again'); }
        const row = game.guesses.length;
        const revealedGuess = result.game.guesses[row];
        draft = '';
        render();
        await revealGuess(revealedGuess, row);
        game = result.game;
        revealing = false;
        render();
        if (game.status === 'won') show('Excellent!');
        else if (game.status === 'lost') show('Great effort!');
        else show('');
      }
      async function loadGame() {
        const response = await fetch('/api/game');
        game = await response.json();
        render();
        if (game.status === 'ready') show('Choose a word from the menu to begin.');
      }
      document.addEventListener('keydown', (event) => {
        if (dialog.open || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') handleKey('↵');
        else if (event.key === 'Backspace') handleKey('⌫');
        else if (/^[a-zA-Z]$/.test(event.key)) handleKey(event.key.toUpperCase());
      });
      document.querySelector('#settings').addEventListener('click', () => dialog.showModal());
      function closeTeacherDialog() {
        document.activeElement?.blur();
        dialog.close();
        setTimeout(() => board.focus(), 0);
      }
      document.querySelector('#cancel').addEventListener('click', closeTeacherDialog);
      teacherForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const answer = new FormData(teacherForm).get('answer').trim().toUpperCase();
        const response = await fetch('/api/game', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer }) });
        const result = await response.json();
        if (!response.ok) return show(result.error || 'Please enter five letters.');
        game = result.game;
        draft = '';
        teacherForm.reset();
        closeTeacherDialog();
        show('New game ready — invite the class to guess!');
        render();
      });
      loadGame();
    </script>
  </body>
</html>
